<!doctype html>
<html><head><meta charset="utf-8"><title>Basic blockquote</title>
<script type="application/json" data-book-designer-manifest>
{
  "format": "book-designer-element", "version": 1, "apiVersion": 1,
  "id": "book-designer.basic-blockquote", "name": "Basic blockquote", "packageVersion": "1.0.0",
  "description": "Quiet quotation styling with inherited book typography.",
  "category": "block.blockquote", "placement": "normal-flow", "contract": "wrap-content", "outputs": ["xhtml"],
  "defaults": { "alignment": "start", "italic": false, "accent": "theme", "inset": 1.25, "spacing": 1.5, "rule": true },
  "settingsSchema": {
    "alignment": { "type": "string", "maxLength": 6, "enum": ["start", "center"] },
    "italic": { "type": "boolean" },
    "accent": { "type": "string", "maxLength": 7, "format": "color-or-theme" },
    "inset": { "type": "number", "minimum": 0, "maximum": 3 },
    "spacing": { "type": "number", "minimum": 0, "maximum": 3 },
    "rule": { "type": "boolean" }
  },
  "presets": [
    { "id": "classic-rule", "name": "Classic rule", "description": "A quiet accent rule and generous inset.", "settings": {} },
    { "id": "plain-quotation", "name": "Plain quotation", "description": "Italic prose without a decorative rule.", "settings": { "italic": true, "rule": false } }
  ]
}
</script>
<style>
body{margin:0;padding:12px;font:14px system-ui,sans-serif;color:var(--bd-ui-text,#222);background:var(--bd-ui-background,#fff)}
label{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px}select,input{font:inherit;color:inherit}select{background:var(--bd-ui-surface,#eee);border:1px solid var(--bd-ui-border,#aaa);border-radius:4px;padding:5px}input[type=range]{width:120px}small{display:block;color:var(--bd-ui-muted,#666);line-height:1.5}input[type=color]{width:36px;border:0;padding:0;background:none}input:focus-visible,select:focus-visible{outline:2px solid var(--bd-ui-accent,#805c2a);outline-offset:2px}
</style></head><body>
<label>Text alignment <select id="alignment"><option value="start">Start</option><option value="center">Center</option></select></label>
<label>Italic text <input id="italic" type="checkbox"></label>
<label>Use theme accent <input id="themeAccent" type="checkbox" checked></label>
<label>Accent color <input id="accent" type="color" value="#805c2a"></label>
<label>Inset <span><input id="inset" type="range" min="0" max="3" step="0.05"><output id="insetValue"></output></span></label>
<label>Vertical spacing <span><input id="spacing" type="range" min="0" max="3" step="0.05"><output id="spacingValue"></output></span></label>
<label>Show rule <input id="rule" type="checkbox"></label>
<small>Spacing is relative to the book’s text size. Typography follows the selected theme.</small>
<script>
(() => {
  const field = id => document.getElementById(id);
  function labels() {
    for (const key of ['inset', 'spacing']) field(key + 'Value').textContent = ' ' + field(key).value + ' em';
    field('accent').disabled = field('themeAccent').checked;
  }
  BookDesignerElement.register({
    applySettings(settings, context) {
      field('alignment').value = settings.alignment;
      field('italic').checked = settings.italic;
      field('themeAccent').checked = settings.accent === 'theme';
      field('accent').value = settings.accent === 'theme' ? context.accentColor : settings.accent;
      field('inset').value = settings.inset; field('spacing').value = settings.spacing; field('rule').checked = settings.rule;
      labels();
    },
    readSettings() {
      return { alignment: field('alignment').value, italic: field('italic').checked, accent: field('themeAccent').checked ? 'theme' : field('accent').value, inset: Number(field('inset').value), spacing: Number(field('spacing').value), rule: field('rule').checked };
    },
    render({ settings: s, context }) {
      const accent = s.accent === 'theme' ? context.accentColor : s.accent;
      return {
        xhtml: '<blockquote><div class="quotation-content" data-book-designer-content-slot=""></div></blockquote>',
        css: ':scope{font-family:inherit;text-align:' + s.alignment + ';font-style:' + (s.italic ? 'italic' : 'normal') + ';margin:' + s.spacing + 'em ' + s.inset + 'em;padding:0 0 0 ' + (s.rule ? '1' : '0') + 'em;border:0;border-inline-start:' + (s.rule ? '.12em solid ' + accent : '0') + '} :scope > .quotation-content > p{text-indent:0}'
      };
    }
  });
  document.addEventListener('input', () => { labels(); BookDesignerElement.notifySettingsChanged(); });
})();
</script></body></html>
